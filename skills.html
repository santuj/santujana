<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Skills</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(to right, #0f2027, #203a43, #2c5364);
            color: white;
            text-align: center;
        }

        .container {
            width: 80%;
            margin: auto;
            padding: 80px 0;
        }

        .container h1 {
            font-size: 50px;
            margin-bottom: 20px;
        }

        .container span {
            color: #ff9800;
        }

        .skills {
            width: 70%;
            margin: auto;
        }

        .skill-box {
            margin: 20px 0;
            text-align: left;
        }

        .skill-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .skill-bar {
            width: 100%;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            overflow: hidden;
        }

        .skill-fill {
            height: 10px;
            background: orange;
            border-radius: 20px;
            transition: width 1s ease-in-out;
        }

        .btn {
            background: orange;
            padding: 12px 20px;
            text-decoration: none;
            font-weight: bold;
            color: black;
            display: inline-block;
            border-radius: 30px;
            margin-top: 30px;
            transition: transform 0.3s ease;
        }

        .btn:hover {
            background: white;
            color: black;
            transform: scale(1.05);
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 10%;
            position: fixed;
            width: 100%;
            top: 0;
            left: 0;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
        }

        .menu-toggle {
            display: none;
            font-size: 24px;
            cursor: pointer;
        }
        .logo {
            width: 130px;
        }

        nav ul {
            display: flex;
            list-style: none;
        }

        nav ul li {
            margin: 0 15px;
        }

        nav ul li a {
            text-decoration: none;
            color: white;
            font-weight: 600;
            transition: color 0.3s ease;
        }

        nav ul li a:hover {
            color: orange;
        }

        .content-wrapper {
            padding-top: 100px;
        }

        footer {
            background: rgba(0, 0, 0, 0.9);
            color: white;
            text-align: center;
            padding: 20px 0;
            margin-top: 250px;
        }

        .social-icons {
            margin-top: 10px;
        }

        .social-icons a {
            color: white;
            margin: 0 15px;
            text-decoration: none;
            font-size: 20px;
            transition: color 0.3s ease;
        }

        .social-icons a:hover {
            color: orange;
        }

        /* Responsive Design */
        @media (max-width: 1024px) {

            nav {
                padding: 15px 5%;
            }

            nav ul {
                display: none;
                flex-direction: column;
                position: absolute;
                top: 60px;
                left: 0;
                width: 100%;
                background: rgba(0, 0, 0, 0.9);
                padding: 10px 0;
                text-align: center;
            }

            nav ul.active {
                display: flex;
            }

            nav ul li {
                margin: 10px 0;
            }

            .menu-toggle {
                display: block;
                color: white;
            }

            .container h1 {
                font-size: 40px;
            }

            .skills {
                width: 80%;
            }

            .skill-box {
                margin: 15px 0;
            }

            .btn {
                padding: 10px 18px;
            }
        }

        @media (max-width: 768px) {
            nav {
                padding: 15px 5%;
            }

            .container {
                padding: 60px 5%;
            }

            .container h1 {
                font-size: 35px;
            }

            .skills {
                width: 90%;
            }

            .skill-title {
                font-size: 16px;
            }

            .btn {
                padding: 10px 16px;
            }
        }

        @media (max-width: 480px) {
            nav {
                padding: 10px 3%;
            }

            .container {
                padding: 40px 3%;
            }

            .container h1 {
                font-size: 30px;
            }

            .skills {
                width: 100%;
            }

            .skill-title {
                font-size: 14px;
            }

            .skill-bar {
                margin: 10px 0;
            }

            .btn {
                padding: 10px 14px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>

    <nav>
        <img src="logo.png" class="logo" alt="Logo">
        <div class="menu-toggle" onclick="toggleMenu()">☰</div>
        <ul id="menu">
            <li><a href="index.html">HOME</a></li>
            <li><a href="about.html">ABOUT</a></li>
            <li><a href="skills.html">SKILLS</a></li>
            <li><a href="service.html">SERVICES</a></li>
            <li><a href="contact.html">CONTACT</a></li>
        </ul>
    </nav>

    <div class="content-wrapper">
        <div class="container">
            <h1>My <span>Skills</span></h1>

            <div class="skills">
                <div class="skill-box">
                    <div class="skill-title">Java | Python | SQL</div>
                    <div class="skill-bar">
                        <div class="skill-fill" style="width: 85%;"></div>
                    </div>
                </div>

                <div class="skill-box">
                    <div class="skill-title">HTML | CSS | JavaScript</div>
                    <div class="skill-bar">
                        <div class="skill-fill" style="width: 90%;"></div>
                    </div>
                </div>

                <div class="skill-box">
                    <div class="skill-title">Excel | Data Analytics | Database Management</div>
                    <div class="skill-bar">
                        <div class="skill-fill" style="width: 80%;"></div>
                    </div>
                </div>
            </div>

            <a href="contact.html" class="btn">Hire Me</a>
        </div>
    </div>

    <footer>
        <p>&copy; 2025 Santu Jana | All Rights Reserved</p>
        <div class="social-icons">
            <a href="mailto:santj261@gmail.com">📧 Email</a>
            <a href="#">🔗 LinkedIn</a>
            <a href="#">🐦 Twitter</a>
            <a href="#">📘 Facebook</a>
            <a href="#">📸 Instagram</a>
        </div>
    </footer>

    <script>
        function toggleMenu() {
            var menu = document.getElementById("menu");
            menu.classList.toggle("active");
        }
    </script>

</body>
</html>
